name: Azure Static Web Apps CI/CD

# Pull requests always come from these same branches, so a pull_request trigger
# would only redeploy the commit the push already deployed, into a throwaway
# per-PR environment. Those environments are capped at 10 and the close job
# never managed to reclaim them, which eventually blocked every deploy. Pushes
# alone cover it: their check runs show up on the pull request too.
on:
  push:
    branches:
      - main
      - dev

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLUE_COAST_0D8F0A81E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          production_branch: "main"
          # A non-production branch reuses one stable preview environment named
          # after itself, so nothing accumulates.
          deployment_environment: ${{ github.ref_name != 'main' && github.ref_name || '' }}
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "app" # App source code path
          api_location: "api" # Api source code path - optional
          output_location: "out" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######
